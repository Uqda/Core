<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Uqda</title>
  <desc id="description">The Arabic word Uqda beside a geometric hexagonal knot.</desc>
  <defs>
    <linearGradient id="uqda-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65c76f"/>
      <stop offset="1" stop-color="#178b52"/>
    </linearGradient>
  </defs>

  <!-- Six-sided network cell, built on a 60-degree grid. -->
  <path fill="url(#uqda-green)" d="M180 22 317 101v158L180 338 43 259V101z"/>

  <!-- Interlocking U/knot; the negative center stays open at every size. -->
  <path fill="#fff" fill-rule="evenodd" d="M94 100 137 75l43 25 43-25 43 25v115l-86 50-86-50zm43 25v65l43 25 43-25v-65l-43 25z"/>

  <!-- Heavy Arabic wordmark with a geometric, modular construction. -->
  <text x="1135" y="247" direction="rtl" unicode-bidi="bidi-override"
        text-anchor="start" fill="#18251e"
        font-family="DejaVu Sans, Noto Kufi Arabic, sans-serif"
        font-size="218" font-weight="700" letter-spacing="-5">عُقَد</text>
</svg>
