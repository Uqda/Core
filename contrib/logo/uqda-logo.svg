<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title description">
  <title id="title">UQDA</title>
  <desc id="description">White geometric UQDA wordmark on a transparent background.</desc>

  <!-- U: open top, chamfered base -->
  <path fill="#fff" d="M25 20h55v145l40 35 40-35V20h55v172l-95 58-95-58z"/>

  <!-- Q: octagonal bowl and a directional tail -->
  <path fill="#fff" fill-rule="evenodd" d="M285 20h105l65 55v105l-65 60H285l-65-60V75zm25 52-35 30v52l35 34h55l35-34v-52l-35-30z"/>
  <path fill="#fff" d="m365 155 105 85h-78l-72-60z"/>

  <!-- D: vertical spine with a faceted outer curve -->
  <path fill="#fff" fill-rule="evenodd" d="M490 20h115l80 58v104l-80 58H490zm58 52v116h40l42-31v-54l-42-31z"/>

  <!-- A: two angular legs joined by a modular crossbar -->
  <path fill="#fff" d="M715 240 795 20h65l115 220h-62l-24-49h-101l-17 49zm92-101h57l-35-72z" fill-rule="evenodd"/>
</svg>
