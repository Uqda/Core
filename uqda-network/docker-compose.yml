version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: uqda-network_dashboard_1
      APP_PORT: 8080

  core:
    # Host networking is required for the Umbrel host to use the uqda0 TUN interface.
    # Only this service receives NET_ADMIN; no Docker socket or privileged mode.
    image: ghcr.io/uqda/core:26.0.4-umbrel.2@sha256:6bb61d60bc3d04a60d42f7c29c78e7d03878574b2557a18f4c49458461bdb4b1
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["control.py"]
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/uqda
      - ${APP_DATA_DIR}/data/control:/run/uqda-control
    tmpfs:
      - /run/uqda-core:mode=0700
    healthcheck:
      test: ["CMD", "python3", "-c", "from control import socket_json; r=socket_json('/run/uqda-control/control.sock', {'action':'status'}); raise SystemExit(0 if r.get('ok') and r['result']['ready'] else 1)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

  dashboard:
    image: ghcr.io/uqda/core:26.0.4-umbrel.2@sha256:6bb61d60bc3d04a60d42f7c29c78e7d03878574b2557a18f4c49458461bdb4b1
    user: "1000:1000"
    command: ["dashboard.py"]
    restart: on-failure
    environment:
      UQDA_DASHBOARD_PASSWORD: ${APP_PASSWORD}
      PORT: "8080"
    volumes:
      - ${APP_DATA_DIR}/data/control:/run/uqda-control
    depends_on:
      - core
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
