version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # New work lands on beta; main only receives tested beta merges.
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    # New work lands on beta; main only receives tested beta merges.
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
