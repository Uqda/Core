name: Release metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare release metadata
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          def version(*args):
              return subprocess.check_output(["sh", "contrib/semver/version.sh", *args], text=True).strip()
          with open("release-metadata.json", "w") as out:
              json.dump({"tag_name": version(), "name": version("--title"),
                         "prerelease": version("--prerelease") == "true", "draft": True}, out, indent=2)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
