name: Idle session recovery

on:
  pull_request:
    paths:
      - .github/workflows/idle-recovery.yml
      - go.mod
      - go.sum
      - src/core/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle-recovery:
    name: First packet after idle (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Exercise expired sessions twice
        env:
          UQDA_TEST_IDLE_RECOVERY: "1"
        run: go test -count=1 -run '^TestIdleSessionRecovery$' -v ./src/core
