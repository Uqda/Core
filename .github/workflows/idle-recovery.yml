name: Idle session recovery

on:
  pull_request:
    paths:
      - .github/workflows/idle-recovery.yml
      - go.mod
      - go.sum
      - src/core/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle-recovery:
    name: First packet after idle (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Exercise expired sessions twice
        env:
          UQDA_TEST_IDLE_RECOVERY: "1"
        run: go test -count=1 -run '^TestIdleSessionRecovery$' -v ./src/core
