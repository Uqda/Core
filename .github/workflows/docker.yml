name: Docker Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docker:
    name: Build Docker Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Release identity
        id: identity
        run: |
          echo "version=$(sh contrib/semver/version.sh --bare)" >> "$GITHUB_OUTPUT"
          echo "title=$(sh contrib/semver/version.sh --display)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$(sh contrib/semver/version.sh)"
          fi

      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./contrib/docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: false
          tags: uqda/core:${{ steps.identity.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.title=${{ steps.identity.outputs.title }}
          provenance: false
