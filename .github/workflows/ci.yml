name: Uqda Core

on:
  push:
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  codeql:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4

  vet:
    name: go vet
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: go vet
        run: go vet ./...

  race:
    # Race detection requires cgo and a supported C compiler.
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: Verify race toolchain
        run: |
          gcc --version
          test "$(go env CGO_ENABLED)" = 1
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: Handshake parser
        run: go test ./src/core -run '^$' -fuzz '^FuzzVersionMetadataDecode$' -fuzztime=10s
      - name: Multicast parser
        run: go test ./src/multicast -run '^$' -fuzz '^FuzzMulticastAdvertisementUnmarshalBinary$' -fuzztime=10s

  lifecycle-stress:
    name: Lifecycle stress
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"
      - name: Repeat core, admin and configuration lifecycles
        run: go test -count=3 ./src/core ./src/admin ./src/config

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Linux, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

      - name: Installer identity tests
        run: |
          go build -o uqda ./cmd/uqda
          python3 tests/packaging/config_test.py "$PWD/uqda"

  privileged-user-tests:
    name: Linux privilege switching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Build test binary
        run: go test -c -o "$RUNNER_TEMP/uqda-user.test" ./cmd/uqda
      - name: Run both user tests with real Linux privileges
        run: |
          getent passwd nobody
          sudo timeout 30s "$RUNNER_TEMP/uqda-user.test" -test.v -test.run '^TestCurrentUserid$'
          sudo timeout 30s "$RUNNER_TEMP/uqda-user.test" -test.v -test.run '^TestCommonUsername$'

      - name: Build Uqda key-search utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev
          make -C contrib/uqda-brute-simple

  interoperability:
    name: Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Pinned upstream daemon and dataplane gate
        run: python3 tests/interop/upstream.py

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image and persistent identity tests
        run: python3 tests/docker/image_test.py

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Windows, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (macOS, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  mobile-android:
    name: Mobile (Android AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UQDA_MOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Install pinned Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Build Android binding
        run: |
          ./contrib/mobile/build -a
          test -s uqda.aar
          sh tests/mobile/android-consumer.sh uqda.aar

  mobile-apple:
    name: Mobile (Apple XCFramework)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UQDA_MOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Install pinned Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Build Apple binding
        run: |
          ./contrib/mobile/build -i
          test -d Uqda.xcframework
          sh tests/mobile/apple-consumer.sh Uqda.xcframework

  build-freebsd:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]
        goos:
          - freebsd
          - openbsd

    name: Build (Cross ${{ matrix.goos }}, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}

  tests-ok:
    name: All tests passed
    needs: [lint, codeql, vet, race, vulncheck, fuzz-smoke, lifecycle-stress, build-linux, build-windows, build-macos, mobile-android, mobile-apple, build-freebsd, privileged-user-tests, interoperability, docker-validation]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check all tests passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$RESULTS")"
          test -z "$failures" || { printf '%s\n' "$failures"; exit 1; }
