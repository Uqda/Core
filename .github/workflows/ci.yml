name: Uqda Core

on:
  push:
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  codeql:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  vet:
    name: go vet
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: go vet
        run: go vet ./...

  race:
    # Race detection requires cgo and a supported C compiler.
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Verify race toolchain
        run: |
          gcc --version
          test "$(go env CGO_ENABLED)" = 1
      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Linux, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

      - name: Installer identity tests
        run: |
          go build -o uqda ./cmd/uqda
          python3 tests/packaging/config_test.py "$PWD/uqda"

  privileged-user-tests:
    name: Linux privilege switching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build test binary
        run: go test -c -o "$RUNNER_TEMP/uqda-user.test" ./cmd/uqda
      - name: Run both user tests with real Linux privileges
        run: |
          getent passwd nobody
          sudo timeout 30s "$RUNNER_TEMP/uqda-user.test" -test.v -test.run '^TestCurrentUserid$'
          sudo timeout 30s "$RUNNER_TEMP/uqda-user.test" -test.v -test.run '^TestCommonUsername$'

      - name: Build Uqda key-search utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev
          make -C contrib/uqda-brute-simple

  interoperability:
    name: Interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Pinned upstream daemon and dataplane gate
        run: python3 tests/interop/upstream.py

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Image and persistent identity tests
        run: python3 tests/docker/image_test.py

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Windows, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (macOS, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-freebsd:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]
        goos:
          - freebsd
          - openbsd

    name: Build (Cross ${{ matrix.goos }}, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build Uqda Core
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}

  tests-ok:
    name: All tests passed
    needs: [lint, codeql, vet, race, vulncheck, build-linux, build-windows, build-macos, build-freebsd, privileged-user-tests, interoperability, docker-validation]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check all tests passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
