name: UQDA

on:
  push:
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  codeql:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  vulnerability-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Scan reachable dependencies
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-package: ./...

  handshake-fuzz-smoke:
    name: Handshake fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Fuzz handshake parser
        run: go test ./src/core -run=^$ -fuzz=FuzzVersionDecode -fuzztime=15s

  e2e-linux:
    name: E2E mesh (Linux namespaces)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Build UQDA
        run: ./build
      - name: Check namespace test prerequisites
        run: |
          command -v ip
          command -v tc
          command -v ping
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: Build legacy protocol fixture
        run: go build -o /tmp/uqda-e2e-legacy-peer ./tests/e2e/legacy_peer.go
      - name: Two-node connectivity
        run: sudo bash tests/e2e/2node.sh
      - name: Three-node routing
        run: sudo bash tests/e2e/3node-routing.sh
      - name: Four-node failover
        run: sudo bash tests/e2e/failover.sh
      - name: Loss and latency resilience
        run: sudo bash tests/e2e/loss-latency.sh
      - name: Strict handshake policy
        run: sudo env UQDA_LEGACY_PEER_BIN=/tmp/uqda-e2e-legacy-peer bash tests/e2e/secure-required.sh

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Linux, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (Windows, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]

    name: Build & Test (macOS, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  build-freebsd:
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25", "1.26"]
        goos:
          - freebsd
          - openbsd

    name: Build (Cross ${{ matrix.goos }}, Go ${{ matrix.goversion }})
    needs: [lint]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.goversion }}

      - name: Build UQDA
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}

  tests-ok:
    name: All tests passed
    needs: [lint, codeql, vulnerability-scan, handshake-fuzz-smoke, e2e-linux, build-linux, build-windows, build-macos, build-freebsd]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check all tests passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
