name: Umbrel integration

on:
  pull_request:
    paths: ['contrib/umbrel/**', 'tests/umbrel/**', 'uqda-network/**', 'umbrel-app-store.yml', '.github/workflows/umbrel.yml']
  push:
    branches: [main, codex/umbrel-uqda]
    paths: ['contrib/umbrel/**', 'tests/umbrel/**', 'uqda-network/**', 'umbrel-app-store.yml', '.github/workflows/umbrel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbrel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Dashboard and configuration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify the pinned Core release
        run: |
          mkdir -p "$RUNNER_TEMP/uqda-release"
          cd "$RUNNER_TEMP/uqda-release"
          curl -fL --retry 3 https://github.com/Uqda/Core/releases/download/v26.0.5/uqda-26.0.5-linux-amd64.tar.gz -o uqda-26.0.5-linux-amd64.tar.gz
          curl -fL --retry 3 https://github.com/Uqda/Core/releases/download/v26.0.5/SHA256SUMS -o SHA256SUMS
          awk '$2 == "uqda-26.0.5-linux-amd64.tar.gz" {print}' SHA256SUMS > selected.sha256
          test -s selected.sha256
          sha256sum -c selected.sha256
          tar -xzf uqda-26.0.5-linux-amd64.tar.gz
      - name: Test authentication, local protocol and persistent identity
        env:
          UQDA_TEST_BINARY: ${{ runner.temp }}/uqda-release/uqda
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/umbrel -v
      - name: Validate JavaScript and package structure
        run: |
          node --check contrib/umbrel/web/app.js
          node tests/umbrel/ui_state.cjs
          python3 tests/umbrel/package_check.py
          git diff --check

  docker:
    name: Native host TUN and container lifecycle (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require native host TUN
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/uqda-browser" playwright@1.51.1
          "$RUNNER_TEMP/uqda-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test Docker integration
        env:
          UQDA_TEST_PASSWORD: ci-dashboard-test-password-0123456789
          UQDA_BROWSER_TEST: '1'
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/uqda-browser/node_modules/playwright
          UQDA_SCREENSHOT_DIR: ${{ runner.temp }}/uqda-screenshots
        run: python3 tests/umbrel/docker_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uqda-dashboard-screenshots-${{ matrix.runner }}
          path: ${{ runner.temp }}/uqda-screenshots

  image:
    name: Build multiarchitecture wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Wrapper version
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          current = pathlib.Path('contrib/umbrel/VERSION').read_text().strip()
          candidate_path = pathlib.Path('contrib/umbrel/CANDIDATE_VERSION')
          candidate = candidate_path.is_file()
          version = candidate_path.read_text().strip() if candidate else current
          pattern = r'(\d+)\.(\d+)\.(\d+)-umbrel\.([1-9]\d*)'
          assert re.fullmatch(pattern, version) and re.fullmatch(pattern, current)
          if candidate:
              assert tuple(map(int, re.fullmatch(pattern, version).groups())) > tuple(map(int, re.fullmatch(pattern, current).groups()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\ncandidate={str(candidate).lower()}\n')
          PYTHON
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.repository == 'Uqda/Core'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable published version
        id: existing
        if: github.event_name == 'push' && github.repository == 'Uqda/Core'
        run: |
          if docker buildx imagetools inspect "ghcr.io/uqda/core:${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/existing-image.txt" 2>/dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo 'This wrapper version already exists; it will not be overwritten. Bump contrib/umbrel/VERSION for wrapper changes.'
          fi
      - name: Build amd64 and arm64
        id: build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: contrib/umbrel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.repository == 'Uqda/Core' }}
          tags: ghcr.io/uqda/core:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/Uqda/Core
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: false
      - name: Record published multiarchitecture digest
        if: github.event_name == 'push' && github.repository == 'Uqda/Core'
        run: |
          docker buildx imagetools inspect "ghcr.io/uqda/core:${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/image.txt"
          DIGEST=$(awk '/^Digest:/ {print $2; exit}' "$RUNNER_TEMP/image.txt")
          test -n "$DIGEST"
          printf 'version=%s\ndigest=%s\nrevision=%s\n' '${{ steps.version.outputs.value }}' "$DIGEST" "$GITHUB_SHA" > "$RUNNER_TEMP/uqda-umbrel-image.txt"
          echo "Published ghcr.io/uqda/core:${{ steps.version.outputs.value }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.repository == 'Uqda/Core'
        with:
          name: uqda-umbrel-image
          path: ${{ runner.temp }}/uqda-umbrel-image.txt
      - name: Export digest-pinned community store
        if: github.event_name == 'push' && github.repository == 'Uqda/Core' && steps.version.outputs.candidate != 'true'
        run: |
          DIGEST=$(awk -F= '/^digest=/ {print $2; exit}' "$RUNNER_TEMP/uqda-umbrel-image.txt")
          python3 contrib/umbrel/export_store.py --digest "$DIGEST" --icon-ref "$GITHUB_SHA" --output "$RUNNER_TEMP/uqda-umbrel-store.zip"
          echo 'The exported store still requires actual Umbrel platform testing; the official development container or a production VM can be used without buying a device.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.repository == 'Uqda/Core' && steps.version.outputs.candidate != 'true'
        with:
          name: uqda-umbrel-store
          path: ${{ runner.temp }}/uqda-umbrel-store.zip
