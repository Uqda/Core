name: Export release container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Uqda release tag to export
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export tagged multiarchitecture image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "$(sh contrib/semver/version.sh)"
          {
            echo "version=$(sh contrib/semver/version.sh --bare)"
            echo "title=$(sh contrib/semver/version.sh --display)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./contrib/docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          outputs: type=oci,dest=${{ runner.temp }}/uqda-image.oci.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.title=${{ steps.identity.outputs.title }}
          provenance: false

      - name: Verify OCI archive
        run: |
          test -s "${{ runner.temp }}/uqda-image.oci.tar"
          tar -tf "${{ runner.temp }}/uqda-image.oci.tar" | grep -Fx oci-layout
          tar -tf "${{ runner.temp }}/uqda-image.oci.tar" | grep -Fx index.json

      - name: Upload OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uqda-${{ steps.identity.outputs.version }}-oci
          path: ${{ runner.temp }}/uqda-image.oci.tar
          if-no-files-found: error
          compression-level: 0
