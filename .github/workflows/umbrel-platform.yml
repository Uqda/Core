name: Umbrel platform validation
on:
  workflow_dispatch:
  push:
    branches: [codex/umbrel-uqda]
    paths: ['.github/workflows/umbrel-platform.yml', 'tests/umbrel/platform.integration.test.ts', 'tests/umbrel/development-service-timeout.conf']
permissions:
  contents: read
concurrency:
  group: umbrel-platform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform:
    name: Official Umbrel 2.0 app lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: core
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: getumbrel/umbrel
          ref: 9298257b0e904ca8d8270b1702672666343f0b86 # official 2.0.0
          path: upstream
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3, same pinned helper as official Umbrel CI
      - name: Require host TUN before creating the privileged development container
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
      - name: Create disposable upstream worktree and package fixture
        run: |
          git -C upstream worktree add worktrees/codex/uqda-platform -b codex/uqda-platform HEAD
          mkdir upstream/worktrees/codex/uqda-platform/uqda-package
          cp -R core/uqda-network core/umbrel-app-store.yml upstream/worktrees/codex/uqda-platform/uqda-package/
          cp core/tests/umbrel/platform.integration.test.ts upstream/worktrees/codex/uqda-platform/packages/umbreld/source/modules/apps/uqda-platform.integration.test.ts
      - name: Start official development platform
        working-directory: upstream/worktrees/codex/uqda-platform
        env:
          UMBREL_DEV_SKIP_CACHE_EXPORT: 'false'
        run: |
          npm run dev start
          # Bound only the empty development service's pre-test stop (upstream
          # defaults to 15 minutes). App-manager restart tests remain unchanged.
          docker exec umbrel-dev mkdir -p /etc/systemd/system/umbrel.service.d
          docker cp "$GITHUB_WORKSPACE/core/tests/umbrel/development-service-timeout.conf" umbrel-dev:/etc/systemd/system/umbrel.service.d/ci-timeout.conf
          docker exec umbrel-dev systemctl daemon-reload
          test "$(docker exec umbrel-dev systemctl show umbrel.service --property TimeoutStopUSec --value)" = '30s'
          npm run --prefix packages/umbreld test:umbrel-dev:prepare
      - name: Test published package through real Umbrel app manager
        working-directory: upstream/worktrees/codex/uqda-platform
        run: npm run dev exec:noninteractive -- env UQDA_PACKAGE_SOURCE=/umbrel-dev/uqda-package npm --prefix /umbrel-dev/packages/umbreld test -- uqda-platform.integration.test.ts
      - name: Platform logs
        if: always()
        run: docker logs --tail 120 umbrel-dev || true
      - name: Stop disposable platform
        if: always()
        run: docker stop --time 30 umbrel-dev || true
