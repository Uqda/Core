name: Packages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pkg.yml"
      - "contrib/**"
      - "build"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vendored-sources:
    name: Vendored Sources

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build archive
        run: |
          NAME="$(sh contrib/semver/name.sh)"
          VERSION="$(sh contrib/semver/version.sh --bare)"
          go mod vendor && tar --exclude-vcs --no-xattrs \
            --exclude="${NAME}-${VERSION}-vendored.tar.gz" \
            -czf "${NAME}-${VERSION}-vendored.tar.gz" *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vendored sources
          path: "*.tar.gz"
          if-no-files-found: error

  build-packages-debian:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["amd64", "i386", "mips", "mipsel", "armhf", "armel", "arm64"]

    name: Package (Debian, ${{ matrix.pkgarch }})

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/deb/generate.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Debian package (${{ matrix.pkgarch }})
          path: "*.deb"
          if-no-files-found: error

  build-packages-macos:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["amd64", "arm64"]

    name: Package (macOS, ${{ matrix.pkgarch }})

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/macos/create-pkg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS package (${{ matrix.pkgarch }})
          path: "*.pkg"
          if-no-files-found: error

  build-packages-windows:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["x64", "x86", "arm64"]

    name: Package (Windows, ${{ matrix.pkgarch }})

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4

      - name: Build package
        run: sh contrib/msi/build-msi.sh ${{ matrix.pkgarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows package (${{ matrix.pkgarch }})
          path: "*.msi"
          if-no-files-found: error

  build-router-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: edgerouter-x
            goarch: mipsle
            gomips: softfloat
          - target: edgerouter-lite
            goarch: mips64
            gomips: ""
          - target: vyos-amd64
            goarch: amd64
            gomips: ""
          - target: vyos-i386
            goarch: "386"
            gomips: ""

    name: Router binaries (${{ matrix.target }})

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Cross-compile binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: 0
        run: |
          ./build
          mkdir -p "uqda-${{ matrix.target }}"
          mv uqda uqdactl "uqda-${{ matrix.target }}/"
          tar -czf "uqda-${{ matrix.target }}.tar.gz" "uqda-${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Router binaries (${{ matrix.target }})
          path: "uqda-${{ matrix.target }}.tar.gz"
          if-no-files-found: error
