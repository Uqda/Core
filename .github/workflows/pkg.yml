name: Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pkg.yml"
      - "src/version/VERSION"
      - "contrib/install/**"
      - "contrib/homebrew/**"
      - "contrib/systemd/uqda.service.quick"
      - "contrib/packaging/install-config.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-portable-linux:
    name: Portable Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - name: Build portable archive
        env:
          GOARCH: ${{ matrix.arch }}
        run: sh contrib/install/build-linux.sh
      - name: Native install, update, remove and purge smoke
        run: |
          ASSET=$(find . -maxdepth 1 -name 'uqda-*-linux-${{ matrix.arch }}.tar.gz' -print -quit)
          test -n "$ASSET"
          mkdir "$RUNNER_TEMP/uqda-assets"
          cp "$ASSET" "$RUNNER_TEMP/uqda-assets/"
          (cd "$RUNNER_TEMP/uqda-assets" && sha256sum "$(basename "$ASSET")" > SHA256SUMS)
          UQDA_VERSION="v$(sh contrib/semver/version.sh --bare)"
          UQDA_DOWNLOAD_BASE_URL="file://$RUNNER_TEMP/uqda-assets"
          UQDA_INSTALL_TEST_MODE=1
          export UQDA_VERSION UQDA_DOWNLOAD_BASE_URL UQDA_INSTALL_TEST_MODE
          sudo --preserve-env=UQDA_VERSION,UQDA_DOWNLOAD_BASE_URL,UQDA_INSTALL_TEST_MODE sh contrib/install/linux.sh install
          sudo systemctl is-active --quiet uqda
          IDENTITY=$(sudo sha256sum /etc/uqda/uqda.conf)
          cp "$RUNNER_TEMP/uqda-assets/SHA256SUMS" "$RUNNER_TEMP/uqda-assets/SHA256SUMS.good"
          printf '%064d  %s\n' 0 "$(basename "$ASSET")" > "$RUNNER_TEMP/uqda-assets/SHA256SUMS"
          if sudo --preserve-env=UQDA_VERSION,UQDA_DOWNLOAD_BASE_URL,UQDA_INSTALL_TEST_MODE sh contrib/install/linux.sh update; then
            echo 'Tampered checksum was accepted' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/uqda-assets/SHA256SUMS.good" "$RUNNER_TEMP/uqda-assets/SHA256SUMS"
          sudo systemctl is-active --quiet uqda
          cp "$RUNNER_TEMP/uqda-assets/$(basename "$ASSET")" "$RUNNER_TEMP/uqda-assets/archive.good"
          python3 - "$RUNNER_TEMP/uqda-assets/$(basename "$ASSET")" <<'PY'
          import io
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "w:gz") as archive:
              for name in ("uqda", "uqdactl", "uqda.service", "install-config.sh"):
                  entry = tarfile.TarInfo(name)
                  if name == "uqda":
                      entry.type = tarfile.SYMTYPE
                      entry.linkname = "/etc/passwd"
                  else:
                      archive.addfile(entry, io.BytesIO())
                      continue
                  archive.addfile(entry)
          PY
          (cd "$RUNNER_TEMP/uqda-assets" && sha256sum "$(basename "$ASSET")" > SHA256SUMS)
          if sudo --preserve-env=UQDA_VERSION,UQDA_DOWNLOAD_BASE_URL,UQDA_INSTALL_TEST_MODE sh contrib/install/linux.sh update; then
            echo 'Archive containing a symlink was accepted' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/uqda-assets/archive.good" "$RUNNER_TEMP/uqda-assets/$(basename "$ASSET")"
          (cd "$RUNNER_TEMP/uqda-assets" && sha256sum "$(basename "$ASSET")" > SHA256SUMS)
          sudo systemctl is-active --quiet uqda
          sudo --preserve-env=UQDA_VERSION,UQDA_DOWNLOAD_BASE_URL,UQDA_INSTALL_TEST_MODE sh contrib/install/linux.sh update
          test "$IDENTITY" = "$(sudo sha256sum /etc/uqda/uqda.conf)"
          sudo sh contrib/install/linux.sh uninstall
          sudo test -s /etc/uqda/uqda.conf
          sudo --preserve-env=UQDA_VERSION,UQDA_DOWNLOAD_BASE_URL,UQDA_INSTALL_TEST_MODE sh contrib/install/linux.sh install
          test "$IDENTITY" = "$(sudo sha256sum /etc/uqda/uqda.conf)"
          sudo sh contrib/install/linux.sh uninstall --purge --yes
          sudo test ! -e /etc/uqda/uqda.conf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Portable Linux (${{ matrix.arch }})
          path: "uqda-*-linux-${{ matrix.arch }}.tar.gz"
          if-no-files-found: error

  homebrew-cask-smoke:
    name: Homebrew cask lifecycle (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install released macOS package through Homebrew
        run: |
          brew tap-new uqda/ci
          TAP_DIR=$(brew --repository uqda/ci)
          mkdir -p "$TAP_DIR/Casks"
          cp contrib/homebrew/Casks/uqda.rb "$TAP_DIR/Casks/uqda.rb"
          brew install --cask uqda/ci/uqda
          # The cask points to the last public release until these new packages
          # have passed validation and are published. Do not compare it to a
          # newer, not-yet-released source version.
          CASK_VERSION=$(brew info --cask --json=v2 uqda/ci/uqda | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')
          test "$(/usr/local/bin/uqda --version)" = "Uqda Core $CASK_VERSION"
          test "$(/usr/local/bin/uqdactl version)" = "Uqda Core $CASK_VERSION"
          sudo /usr/local/bin/uqda -useconffile /etc/uqda/uqda.conf -checkconf
          IDENTITY=$(sudo shasum -a 256 /etc/uqda/uqda.conf)
          brew reinstall --cask uqda/ci/uqda
          test "$IDENTITY" = "$(sudo shasum -a 256 /etc/uqda/uqda.conf)"
          brew uninstall --cask uqda/ci/uqda
          sudo test -s /etc/uqda/uqda.conf

  build-vendored-sources:
    name: Vendored Sources

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build archive
        run: |
          NAME="$(sh contrib/semver/name.sh)"
          VERSION="$(sh contrib/semver/version.sh --bare)"
          go mod vendor && tar --exclude-vcs --no-xattrs \
            --exclude="${NAME}-${VERSION}-vendored.tar.gz" \
            -czf "${NAME}-${VERSION}-vendored.tar.gz" ./*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vendored sources
          path: "*.tar.gz"
          if-no-files-found: error

  build-packages-debian:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["amd64", "i386", "mips", "mipsel", "armhf", "armel", "arm64"]

    name: Package (Debian, ${{ matrix.pkgarch }})

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/deb/generate.sh

      - name: Native install, reinstall and removal smoke
        if: matrix.pkgarch == 'amd64'
        run: |
          PACKAGE=$(find . -maxdepth 1 -name '*.deb' -print -quit)
          sudo dpkg -i "$PACKAGE"
          test "$(/usr/bin/uqda --version)" = "$(sh contrib/semver/version.sh --display)"
          sudo /usr/bin/uqda -useconffile /etc/uqda/uqda.conf -checkconf
          IDENTITY=$(sudo sha256sum /etc/uqda/uqda.conf)
          sudo dpkg -i "$PACKAGE"
          test "$IDENTITY" = "$(sudo sha256sum /etc/uqda/uqda.conf)"
          sudo dpkg -r uqda
          test ! -e /usr/bin/uqda
          sudo test -s /etc/uqda/uqda.conf

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Debian package (${{ matrix.pkgarch }})
          path: "*.deb"
          if-no-files-found: error

  build-packages-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgarch: amd64
            runner: macos-15-intel
          - pkgarch: arm64
            runner: macos-latest

    name: Package (macOS, ${{ matrix.pkgarch }})

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build package
        env:
          PKGARCH: ${{ matrix.pkgarch }}
        run: sh contrib/macos/create-pkg.sh

      - name: Native upgrade from 26.0.3 and reinstall smoke
        env:
          GH_TOKEN: ${{ github.token }}
          PKGARCH: ${{ matrix.pkgarch }}
        run: |
          OLD_ASSETS="$RUNNER_TEMP/uqda-previous"
          mkdir -p "$OLD_ASSETS"
          gh release download v26.0.3 --repo Uqda/Core \
            --pattern "uqda-26.0.3-macos-${PKGARCH}.pkg" --pattern SHA256SUMS \
            --dir "$OLD_ASSETS"
          (cd "$OLD_ASSETS" && grep "uqda-26.0.3-macos-${PKGARCH}.pkg$" SHA256SUMS | shasum -a 256 -c -)
          sudo installer -pkg "$OLD_ASSETS/uqda-26.0.3-macos-${PKGARCH}.pkg" -target /
          test "$(/usr/local/bin/uqda --version)" = "Uqda Core 26.0.3"
          IDENTITY=$(sudo shasum -a 256 /etc/uqda/uqda.conf)
          PACKAGE=$(find . -maxdepth 1 -name '*.pkg' -print -quit)
          sudo installer -pkg "$PACKAGE" -target /
          test "$(/usr/local/bin/uqda --version)" = "$(sh contrib/semver/version.sh --display)"
          test "$(/usr/local/bin/uqdactl version)" = "$(sh contrib/semver/version.sh --display)"
          sudo /usr/local/bin/uqda -useconffile /etc/uqda/uqda.conf -checkconf
          test "$IDENTITY" = "$(sudo shasum -a 256 /etc/uqda/uqda.conf)"
          /usr/local/bin/uqda help addPeer | grep -F 'uri='
          /usr/local/bin/uqda help find | grep -F 'country=NAME'
          sudo /usr/local/bin/uqda info
          sudo installer -pkg "$PACKAGE" -target /
          test "$IDENTITY" = "$(sudo shasum -a 256 /etc/uqda/uqda.conf)"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS package (${{ matrix.pkgarch }})
          path: "*.pkg"
          if-no-files-found: error

  build-packages-windows:
    strategy:
      fail-fast: false
      matrix:
        pkgarch: ["x64", "x86", "arm64"]

    name: Package (Windows, ${{ matrix.pkgarch }})

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Set up WiX v3
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX v3 not found' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build package
        run: sh contrib/msi/build-msi.sh ${{ matrix.pkgarch }}

      - name: Native install, repair and removal smoke
        if: matrix.pkgarch != 'arm64'
        shell: pwsh
        run: |
          $msi = Get-ChildItem *.msi | Select-Object -First 1
          function Invoke-Msi([string]$Operation, [string]$Log) {
            $arguments = "$Operation `"$($msi.FullName)`" /qn /norestart /L*V `"$Log`""
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path $Log) { Get-Content $Log }
              throw "msiexec $Operation failed with exit code $($process.ExitCode)"
            }
          }
          Invoke-Msi '/i' "$env:RUNNER_TEMP\uqda-install.log"
          $installRoot = if ('${{ matrix.pkgarch }}' -eq 'x86') { ${env:ProgramFiles(x86)} } else { $env:ProgramFiles }
          $uqda = Join-Path $installRoot 'Uqda\uqda.exe'
          $config = Join-Path $env:ProgramData 'Uqda\uqda.conf'
          $reportedVersion = & $uqda --version
          if ($LASTEXITCODE -ne 0) { throw "Version command failed: $reportedVersion" }
          $expectedVersion = go run ./cmd/uqda -version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion.Trim() -ne $expectedVersion.Trim()) { throw "Unexpected version: $reportedVersion (expected $expectedVersion)" }
          & $uqda -useconffile $config -checkconf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = (Get-FileHash -Algorithm SHA256 $config).Hash
          Invoke-Msi '/fa' "$env:RUNNER_TEMP\uqda-repair.log"
          if ((Get-FileHash -Algorithm SHA256 $config).Hash -ne $identity) { throw 'MSI repair changed the node identity' }
          Invoke-Msi '/x' "$env:RUNNER_TEMP\uqda-remove.log"
          if (Test-Path $uqda) { throw 'MSI removal left the executable installed' }
          if (-not (Test-Path $config)) { throw 'MSI removal deleted the persistent identity' }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows package (${{ matrix.pkgarch }})
          path: "*.msi"
          if-no-files-found: error

  build-mobile-android:
    name: Mobile package (Android AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UQDA_MOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install pinned Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Build and consume Android binding
        run: |
          ./contrib/mobile/build -a
          sh tests/mobile/android-consumer.sh uqda.aar
          VERSION=$(sh contrib/semver/version.sh --bare)
          mv uqda.aar "uqda-${VERSION}-android.aar"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android AAR
          path: "uqda-*-android.aar"
          if-no-files-found: error

  build-mobile-apple:
    name: Mobile package (Apple XCFramework)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UQDA_MOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install pinned Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Build and consume Apple binding
        run: |
          ./contrib/mobile/build -i
          sh tests/mobile/apple-consumer.sh Uqda.xcframework
          VERSION=$(sh contrib/semver/version.sh --bare)
          ditto -c -k --sequesterRsrc --keepParent Uqda.xcframework \
            "uqda-${VERSION}-apple-xcframework.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apple XCFramework
          path: "uqda-*-apple-xcframework.zip"
          if-no-files-found: error
